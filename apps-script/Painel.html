<!DOCTYPE html><html><head><base target="_top"><style>body{font:14px Arial;padding:16px}input,select,button{padding:8px;margin:4px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #ddd;padding:6px;text-align:left}.row{display:flex;flex-wrap:wrap}</style></head><body><h2>Agendamentos do dia</h2><div class="row"><input id="date" type="date"><input id="time" type="time"><select id="client"></select><select id="staff"></select><select id="service"></select><input id="end" type="time" placeholder="Fim (opcional)"><input id="price" type="number" placeholder="Valor"><input id="note" placeholder="Observações"><button onclick="save()">Agendar</button></div><div id="msg"></div><table><thead><tr><th>Hora</th><th>Cliente</th><th>Funcionário</th><th>Serviço</th><th>Fim</th><th>Status</th><th>Ação</th></tr></thead><tbody id="body"></tbody></table><hr><h3>Cadastro rápido</h3><input id="newclient" placeholder="Nome cliente"><input id="phone" placeholder="Telefone"><button onclick="client()">Cadastrar cliente</button><input id="newstaff" placeholder="Nome funcionário"><button onclick="staff()">Cadastrar funcionário</button><input id="newservice" placeholder="Serviço"><input id="duration" type="number" placeholder="Duração min"><input id="serviceprice" type="number" placeholder="Preço"><button onclick="service()">Cadastrar serviço</button><script>let data;function load(){document.getElementById('date').value=new Date().toISOString().slice(0,10);google.script.run.withSuccessHandler(x=>{data=x;fill('client',x.clientes,'ID Cliente','Nome');fill('staff',x.funcionarios,'ID Funcionário','Nome');fill('service',x.servicos,'ID Serviço','Nome');render(x.agenda)}).withFailureHandler(e=>msg(e.message)).inicializarDadosPainel()}function fill(id,rows,key,label){document.getElementById(id).innerHTML=rows.map(r=>'<option value="'+r[key]+'">'+r[label]+'</option>').join('')}function msg(t){document.getElementById('msg').innerText=t}function render(rows){document.getElementById('body').innerHTML=rows.map(a=>'<tr><td>'+a['Hora inicial']+'</td><td>'+name(data.clientes,'ID Cliente',a['ID Cliente'])+'</td><td>'+name(data.funcionarios,'ID Funcionário',a['ID Funcionário'])+'</td><td>'+name(data.servicos,'ID Serviço',a['ID Serviço'])+'</td><td>'+a['Hora final']+'</td><td>'+a.Status+'</td><td><button onclick="cancel(\''+a['ID Agendamento']+'\')">Cancelar</button></td></tr>').join('')}function name(rows,key,id){let r=rows.find(x=>x[key]==id);return r?r.Nome:''}function save(){let d={'Data':date.value,'Hora inicial':time.value,'Hora final':end.value,'ID Cliente':client.value,'ID Funcionário':staff.value,'ID Serviço':service.value,'Valor':price.value,'Observações':note.value};google.script.run.withSuccessHandler(()=>{msg('Agendamento salvo');load()}).withFailureHandler(e=>msg(e.message)).criarAgendamento(d)}function cancel(id){google.script.run.withSuccessHandler(load).withFailureHandler(e=>msg(e.message)).atualizarStatusAgendamento(id,'Cancelado')}function client(){google.script.run.withSuccessHandler(load).withFailureHandler(e=>msg(e.message)).cadastrarCliente({Nome:newclient.value,Telefone:phone.value})}function staff(){google.script.run.withSuccessHandler(load).withFailureHandler(e=>msg(e.message)).cadastrarFuncionario({Nome:newstaff.value})}function service(){google.script.run.withSuccessHandler(load).withFailureHandler(e=>msg(e.message)).cadastrarServico({Nome:newservice.value,'Duração padrão (min)':duration.value,'Preço padrão':serviceprice.value})}load();</script></body></html>
